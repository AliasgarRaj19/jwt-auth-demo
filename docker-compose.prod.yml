services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 5500
      CLIENT_URL: ${CLIENT_URL}
      APP_URL: ${APP_URL}
      COOKIE_SECURE: true
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5500:5500"
    command: sh -c "npx prisma generate && npx prisma migrate deploy && node src/index.js"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        VITE_API_URL: /jwt-auth-demo/api
        VITE_APP_BASE_PATH: /jwt-auth-demo
    env_file:
      - .env.production
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME}
      NGINX_SSL_CERTIFICATE: ${NGINX_SSL_CERTIFICATE}
      NGINX_SSL_CERTIFICATE_KEY: ${NGINX_SSL_CERTIFICATE_KEY}
    depends_on:
      - server
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
